<!DOCTYPE html>
<html>
    <head>
        <title>Multi-page Explore Countries Website &#127757;</title>
        <style>
            body,html{
                height: auto;
                overflow-x: hidden;
            }
            body{
                margin: 0;
                padding: 0;
                height: 100vh;
                background-image: url(worldimage.jpg);
                background-position: center;
                background-repeat: no-repeat;
                background-size: cover;
                font-family: Poppins;
            }
            @font-face {
                font-family: Poppins;
                src: url(Poppins-Light.ttf);
            }
            header{
                width: 100%;
                height: 150px;
            }
            #title{
                color: white;
                text-align: center;
                padding: 0px;
                margin: 0px;
            }
            #maincontainer{
                width: 100%;
                height: 500px;
                display: flex;
                justify-content: center;
                align-items: flex-start;
                gap: 100px;
                z-index: 1;
            }
            .firstbox{
                width: 300px;
                height: 400px;
                border-radius: 10px;
                border: 10px outset rgb(24, 24, 109);
                background: linear-gradient(135deg, #6a11cb, #2575fc);
                transform: translateY(-25px);
                animation: fadeUp 1s ease forwards;
                animation-delay: 1.5s;
                opacity: 0;
                z-index: 1;
            }
            @keyframes fadeUp {
                to{
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            #secondtitle{
                padding-left: 30px;
                color: white;
                padding-top: 70px;
            }
            #list{
                font-size: 18px;
                padding-left: 50px;
                color: white;
                line-height: 40px;
            }
            .secondbox{
                width: 300px;
                height: 400px;
                border-radius: 10px;
                border: 10px inset rgb(22, 21, 21);
                background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
                transform: translateY(-25px);
                animation: fadeUp 1s ease forwards;
                animation-delay: 1s;
                opacity: 0;
            }
            @keyframes fadeUp {
                to{
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .thirdbox{
                width: 300px;
                height: 400px;
                border-radius: 10px;
                border: 10px groove rgb(19, 179, 99);
                background: linear-gradient(135deg, #00f260, #0575e6);
                transform: translateY(-25px);
                animation: fadeUp 1s ease forwards;
                animation-delay: 0.5s;
                opacity: 0;
            }
            @keyframes fadeUp {
                to{
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            #uxmain{
                width: 150px;
                display: inline-block;
                margin-left: 25%;
                margin-top: 30%;
            }
            .dropdown{
                width: 150px;
                padding: 10px;
                border: none;
                border-radius: 5px;
                background: linear-gradient(135deg, #2c5364,#203a43, #0f2027);
                color: white;
                font-size: 19px;
            }
            #uxsecond{
                width: 150px;
                border-radius: 5px;
                transition: all 0.5s ease;
                transform: translateY(-10px);
                opacity: 0;
                visibility: hidden;
            }
            .lists{
                color: white;
                background: linear-gradient(135deg, #2c5364,#203a43, #0f2027);
                border-radius: 5px;
                padding: 10px;
                text-decoration: none;
                display: block;
                margin-top: 5px;
                transition: all 0.3s ease;
            }
            .lists:hover{
                transform: translateY(-10px);
            }
            #uxmain:hover #uxsecond{
                opacity: 1;
                transform: translateY(0);
                visibility: visible;
            }
            #uxmain2{
                width: 50px;
                text-align: center;
                z-index: 4;
                position: relative;
                bottom: 40px;
                left: 50px;
            }
            .dropdown2{
                width: 50px;
                padding: 10px;
                border: none;
                border-radius: 5px;
                background: linear-gradient(135deg, #ffb347, #ff7b00, #ff4d00);
                color: white;
                font-size: 30px;
                z-index: 4;
            }
            #uxthird{
                width: 150px;
                position: relative;
                right: 35px;
                border-radius: 5px;
                transition: all 0.5s ease;
                transform: translateY(-10px);
                opacity: 0;
                visibility: hidden;
                z-index: 4;
            }
            .lists2{
                color: white;
                background: linear-gradient(135deg, #ffb347, #ff7b00, #ff4d00);
                border-radius: 5px;
                padding: 10px;
                text-decoration: none;
                display: block;
                margin-top: 5px;
                transition: all 0.3s ease;
            }
            .lists2:hover{
                transform: translateY(-10px);
            }
            #uxmain2:hover #uxthird{
                opacity: 1;
                transform: translateY(0);
                visibility: visible;
            }
            form{
                color: white;
                text-align: center;
                padding-top: 100px;
            }
            input{
                background: linear-gradient(135deg, #00c6ff, #38ef7d);
                border: 5px groove rgb(83, 83, 214);
                width: 200px;
                height: 30px;
            }
            #special{
                width: 150px;
                padding: 10px;
                height: 50px;
                margin-top: 20px;
                transition: all 1.5s ease;
                background: linear-gradient(135deg, #00c6ff, #38ef7d);
                border-radius: 15px;
                border: 5px solid darkblue;
                font-size: 20px;
                color: white;
            }
            #special:hover{
                transform: rotateX(360deg);
            }
        </style>
    </head>
    <body>
        <header>
        <h1 id="title">Explore the world &#127757;</h1>
        <div id="uxmain2">
            <div class="dropdown2">&#9776;</div>
            <div id="uxthird">
                <a href="seventhproject.html" class="lists2">Home</a>
                <a href="aboutus.html" class="lists2">About us</a>
                <a href="policy.html" class="lists2">Policy</a>
                <a href="contact.html" class="lists2">Contact</a>
            </div>
            </div>
            </header>
        <div id="maincontainer">
        <div class="firstbox">
            <h2 id="secondtitle">Why this website</h2>
                <ul id="list">
                    <li>&#10024; learn about cultures</li>
                    <li>&#128218; Discover new places</li>
                    <li>&#127919; Simple and fun</li>
                    <li>&#9889; Easy to use</li>
                </ul>  
        </div>
        <div class="secondbox">
            <div id="uxmain">
            <button class="dropdown">Countires</button>
            <div id="uxsecond">
                <a href="afghanistan.html" class="lists">&#127462;&#127467; Afghanistan</a>
                <a href="usa.html" class="lists">&#127482;&#127480; USA</a>
                <a href="germany.html" class="lists">&#127465;&#127466; Germany</a>
                <a href="france.html" class="lists">&#127467;&#127479; France</a>
            </div>
            </div>
        </div>
        <div class="thirdbox">
            <div id="fourthbox">
                <form>
                    <label>Username:</label><br>
                    <input type="text" required placeholder="Please enter your username"><br>
                    <label>Email:</label><br>
                    <input type="email" required placeholder="Please enter your email"><br>
                    <button value="submit" id="special">Submit</button>
                </form>
            </div>
        </div>
        </div>
    </body>
</html>
